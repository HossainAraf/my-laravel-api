name: PHPStan Analysis

on:
  pull_request:
    branches:
      - main
      - develop
      - feature/* # Adjust according to your branch naming convention

jobs:
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'  # Adjust PHP version as needed

      - name: Install dependencies
        run: |
          composer install

      - name: Run PHPStan
        run: |
          ./vendor/bin/phpstan analyse --level=max --paths=app,config,database
